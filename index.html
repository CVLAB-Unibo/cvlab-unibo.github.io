<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Work in Progress</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0A0F1E;
      --surface:  #111827;
      --accent:   #1E3A5F;
      --blue:     #4A90D9;
      --text:     #F0F4F8;
      --muted:    #8899AA;
      --bar-bg:   #1C2A3A;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      max-width: 560px;
      width: 90%;
      text-align: left;
    }

    .label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--blue);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .label::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 300;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
      color: var(--text);
    }

    h1 span.cursor {
      display: inline-block;
      width: 3px;
      height: 0.9em;
      background: var(--blue);
      margin-left: 4px;
      vertical-align: middle;
      animation: blink 1.1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    p {
      font-size: 1rem;
      font-weight: 300;
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2.5rem;
      max-width: 44ch;
    }

    .progress-wrap {
      margin-bottom: 0.6rem;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: var(--bar-bg);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: 2px;
    }

    .progress-label {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.5rem;
      font-weight: 400;
    }

    .logo-wrap {
      display: inline-block;
      background: #ffffff;
      border-radius: 16px;
      padding: 12px 16px;
      margin-bottom: 2rem;
    }

    .logo-wrap img {
      display: block;
      height: 80px;
      width: auto;
    }

    footer {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.72rem;
      color: #374151;
      letter-spacing: 0.05em;
    }

    @media (prefers-reduced-motion: reduce) {
      .label::before, h1 span.cursor { animation: none; }
    }
  </style>
</head>
